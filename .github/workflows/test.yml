# 푸시마다 단위 테스트와 화면 테스트를 돌린다.
# 화면 테스트는 그리기만 하고 기준 그림과 비교하지 않는다(Mac과 리눅스의 글꼴 그리기가 달라서).
# 기준 그림 비교는 릴리스 전에 Mac에서: ./gradlew verifyRoborazziDebug
name: 테스트

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37 설치
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: 단위 테스트·화면 테스트
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: 테스트 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14
